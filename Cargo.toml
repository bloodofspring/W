[package]
name = "sendnudes"
version = "0.1.0"
edition = "2021"

[dependencies]
directories = "5"
eframe = { version = "0.29", default-features = true, features = ["default_fonts"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
